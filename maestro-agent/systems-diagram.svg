<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="960" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Maestro Agent Governance Architecture</text>

  <!-- ============================================================ -->
  <!-- LAYER 1: External LLM Backends (Blue) -->
  <!-- ============================================================ -->
  <rect x="50" y="52" width="800" height="70" rx="8" fill="#2980b9" opacity="0.12" stroke="#2980b9" stroke-width="1.5"/>
  <text x="70" y="72" font-size="11" fill="#2980b9" font-weight="bold">EXTERNAL LLM BACKENDS</text>

  <!-- Claude -->
  <rect x="80" y="82" width="150" height="30" rx="6" fill="#2980b9" opacity="0.9"/>
  <text x="155" y="102" text-anchor="middle" font-size="12" fill="white" font-weight="600">Claude API</text>

  <!-- GPT -->
  <rect x="260" y="82" width="150" height="30" rx="6" fill="#2980b9" opacity="0.9"/>
  <text x="335" y="102" text-anchor="middle" font-size="12" fill="white" font-weight="600">OpenAI API</text>

  <!-- Gemini -->
  <rect x="440" y="82" width="150" height="30" rx="6" fill="#2980b9" opacity="0.9"/>
  <text x="515" y="102" text-anchor="middle" font-size="12" fill="white" font-weight="600">Gemini API</text>

  <!-- Nemotron / Custom -->
  <rect x="620" y="82" width="200" height="30" rx="6" fill="#2980b9" opacity="0.9"/>
  <text x="720" y="102" text-anchor="middle" font-size="12" fill="white" font-weight="600">Nemotron / Custom</text>

  <!-- Arrows from backends down -->
  <line x1="155" y1="112" x2="450" y2="148" stroke="#2980b9" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <line x1="335" y1="112" x2="450" y2="148" stroke="#2980b9" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <line x1="515" y1="112" x2="450" y2="148" stroke="#2980b9" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="112" x2="450" y2="148" stroke="#2980b9" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: Maestro Orchestrator (Green) -->
  <!-- ============================================================ -->
  <rect x="50" y="140" width="800" height="300" rx="8" fill="#27ae60" opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
  <text x="70" y="160" font-size="11" fill="#27ae60" font-weight="bold">MAESTRO ORCHESTRATOR</text>

  <!-- Streaming Adapter -->
  <rect x="310" y="170" width="280" height="34" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="white" font-weight="600">Streaming Adapter</text>
  <text x="450" y="200" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">SSE normalization across providers</text>

  <!-- Arrow -->
  <line x1="450" y1="204" x2="450" y2="218" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Output Validator (moved up in flow: validate intent before parsing mechanism) -->
  <rect x="310" y="220" width="280" height="44" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="white" font-weight="600">Output Validator</text>
  <text x="450" y="250" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Confidence, citations, schema compliance,</text>
  <text x="450" y="258" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">policy compliance, destructive-action detection</text>

  <!-- Arrow -->
  <line x1="450" y1="264" x2="450" y2="278" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Tool Interception Proxy -->
  <rect x="310" y="280" width="280" height="34" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="white" font-weight="600">Tool Interception Proxy</text>
  <text x="450" y="308" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Normalize, validate, authorize, log, and route tool calls</text>

  <!-- Arrow -->
  <line x1="450" y1="314" x2="450" y2="328" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Permission Gate -->
  <rect x="310" y="330" width="280" height="34" rx="6" fill="#e67e22" opacity="0.9"/>
  <text x="450" y="348" text-anchor="middle" font-size="11" fill="white" font-weight="600">Permission Gate</text>
  <text x="450" y="358" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Allow / Deny / Escalate / Fail Closed</text>

  <!-- Context Manager (left side) -->
  <rect x="70" y="220" width="210" height="60" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="175" y="244" text-anchor="middle" font-size="11" fill="white" font-weight="600">Context Manager</text>
  <text x="175" y="256" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Per-model token counting</text>
  <text x="175" y="268" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Pinned / Summary / Verbatim</text>

  <!-- Self-Exemption Prevention (left side, below context manager) -->
  <rect x="70" y="310" width="210" height="54" rx="6" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="1"/>
  <text x="175" y="328" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="600">Self-Exemption Prevention</text>
  <text x="175" y="341" text-anchor="middle" font-size="8" fill="#c0392b">Policy, config, and gate controls are</text>
  <text x="175" y="352" text-anchor="middle" font-size="8" fill="#c0392b">read-only to the agent process</text>

  <!-- Connecting arrows between side components and center -->
  <line x1="280" y1="250" x2="308" y2="237" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- Harness-Controlled Agent Boundary (dashed) -->
  <!-- ============================================================ -->
  <rect x="40" y="135" width="820" height="315" rx="12" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="845" y="155" text-anchor="end" font-size="9" fill="#c0392b" font-weight="bold">HARNESS-CONTROLLED AGENT BOUNDARY</text>

  <!-- ============================================================ -->
  <!-- LAYER 3: 4M Governance Layer -->
  <!-- ============================================================ -->
  <rect x="50" y="465" width="800" height="110" rx="8" fill="#8e44ad" opacity="0.08" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="70" y="485" font-size="11" fill="#8e44ad" font-weight="bold">4M GOVERNANCE LAYER</text>

  <!-- Arrow from Permission Gate to 4M -->
  <line x1="450" y1="364" x2="450" y2="465" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="420" font-size="8" fill="#555">policy check</text>

  <!-- Mission -->
  <rect x="70" y="498" width="170" height="66" rx="6" fill="#8e44ad" opacity="0.8"/>
  <text x="155" y="517" text-anchor="middle" font-size="12" fill="white" font-weight="700">Mission</text>
  <text x="155" y="530" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">(Objective Scope)</text>
  <text x="155" y="543" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Telos + Mereology</text>
  <text x="155" y="555" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Sub-missions, intent class.</text>

  <!-- Mind -->
  <rect x="260" y="498" width="170" height="66" rx="6" fill="#8e44ad" opacity="0.8"/>
  <text x="345" y="517" text-anchor="middle" font-size="12" fill="white" font-weight="700">Mind</text>
  <text x="345" y="530" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">(Inference Discipline)</text>
  <text x="345" y="543" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Ontic + Epistemic</text>
  <text x="345" y="555" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Reasoning, inference modes</text>

  <!-- Morals -->
  <rect x="450" y="498" width="170" height="66" rx="6" fill="#8e44ad" opacity="0.8"/>
  <text x="535" y="517" text-anchor="middle" font-size="12" fill="white" font-weight="700">Morals</text>
  <text x="535" y="530" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">(Policy Constraints)</text>
  <text x="535" y="543" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Deontic</text>
  <text x="535" y="555" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Gates, validation, refusal</text>

  <!-- Memory -->
  <rect x="640" y="498" width="190" height="66" rx="6" fill="#8e44ad" opacity="0.8"/>
  <text x="735" y="517" text-anchor="middle" font-size="12" fill="white" font-weight="700">Memory</text>
  <text x="735" y="530" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">(State &amp; Provenance)</text>
  <text x="735" y="543" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Temporal</text>
  <text x="735" y="555" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">Session + persistent store</text>

  <!-- Cross-cutting channel arrows between 4M modules -->
  <path d="M155,564 Q155,580 345,580 Q345,580 345,564" fill="none" stroke="#8e44ad" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="250" y="590" text-anchor="middle" font-size="7" fill="#8e44ad">Mission to Morals</text>
  <path d="M735,564 Q735,585 345,585 Q345,585 345,564" fill="none" stroke="#8e44ad" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="540" y="598" text-anchor="middle" font-size="7" fill="#8e44ad">Memory to Mind</text>

  <!-- ============================================================ -->
  <!-- Audit & Provenance Store (cross-cutting, near 4M layer) -->
  <!-- ============================================================ -->
  <rect x="620" y="380" width="220" height="70" rx="6" fill="#2c3e50" opacity="0.12" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="730" y="398" text-anchor="middle" font-size="10" fill="#2c3e50" font-weight="700">Audit &amp; Provenance Store</text>
  <text x="730" y="412" text-anchor="middle" font-size="8" fill="#2c3e50">Decision trace, tool calls, approvals,</text>
  <text x="730" y="423" text-anchor="middle" font-size="8" fill="#2c3e50">execution logs, rollback evidence</text>

  <!-- Dashed lines from key components to Audit Store -->
  <line x1="590" y1="350" x2="620" y2="395" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="590" y1="300" x2="620" y2="390" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ============================================================ -->
  <!-- LAYER 4: Gate Scripts (Red/Orange) -->
  <!-- ============================================================ -->
  <rect x="50" y="615" width="800" height="70" rx="8" fill="#e74c3c" opacity="0.08" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="70" y="635" font-size="11" fill="#e74c3c" font-weight="bold">GATE SCRIPTS</text>

  <!-- Arrow from 4M to Gates -->
  <line x1="450" y1="575" x2="450" y2="615" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <text x="460" y="600" font-size="8" fill="#c0392b">enforce</text>

  <!-- CDAE -->
  <rect x="70" y="645" width="120" height="28" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="130" y="664" text-anchor="middle" font-size="10" fill="white" font-weight="600">CDAE</text>

  <!-- pre-commit -->
  <rect x="210" y="645" width="120" height="28" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="270" y="664" text-anchor="middle" font-size="10" fill="white" font-weight="600">pre-commit</text>

  <!-- pre-push -->
  <rect x="350" y="645" width="120" height="28" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="410" y="664" text-anchor="middle" font-size="10" fill="white" font-weight="600">pre-push</text>

  <!-- pre-delete -->
  <rect x="490" y="645" width="120" height="28" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="550" y="664" text-anchor="middle" font-size="10" fill="white" font-weight="600">pre-delete</text>

  <!-- pre-publish -->
  <rect x="630" y="645" width="120" height="28" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="690" y="664" text-anchor="middle" font-size="10" fill="white" font-weight="600">pre-publish</text>

  <!-- ============================================================ -->
  <!-- LAYER 5: Execution Layer (Gray) with capability classes -->
  <!-- ============================================================ -->
  <rect x="50" y="710" width="800" height="80" rx="8" fill="#7f8c8d" opacity="0.1" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="70" y="730" font-size="11" fill="#7f8c8d" font-weight="bold">EXECUTION LAYER (MEANS)</text>

  <!-- Arrow from Gates to Execution -->
  <line x1="450" y1="673" x2="450" y2="710" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="697" font-size="8" fill="#555">execute</text>

  <!-- Capability class labels -->
  <rect x="80" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="135" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Read</text>

  <rect x="210" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="265" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Write</text>

  <rect x="340" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="395" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Mutate</text>

  <rect x="470" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="525" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Publish</text>

  <rect x="600" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="655" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Delete</text>

  <rect x="730" y="740" width="110" height="28" rx="5" fill="#7f8c8d" opacity="0.7"/>
  <text x="785" y="757" text-anchor="middle" font-size="10" fill="white" font-weight="600">Exfiltrate</text>

  <!-- Arrow from Execution to Audit Store -->
  <line x1="730" y1="710" x2="730" y2="450" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="740" y="470" font-size="7" fill="#2c3e50">log</text>

  <!-- ============================================================ -->
  <!-- Legend -->
  <!-- ============================================================ -->
  <rect x="50" y="815" width="800" height="130" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="835" font-size="10" font-weight="bold" fill="#2c3e50">Legend</text>

  <rect x="70" y="848" width="14" height="14" rx="3" fill="#2980b9"/>
  <text x="90" y="859" font-size="9" fill="#555">LLM Backends</text>

  <rect x="190" y="848" width="14" height="14" rx="3" fill="#27ae60" opacity="0.85"/>
  <text x="210" y="859" font-size="9" fill="#555">Orchestrator</text>

  <rect x="310" y="848" width="14" height="14" rx="3" fill="#e67e22" opacity="0.9"/>
  <text x="330" y="859" font-size="9" fill="#555">Permission Gate</text>

  <rect x="440" y="848" width="14" height="14" rx="3" fill="#8e44ad" opacity="0.8"/>
  <text x="460" y="859" font-size="9" fill="#555">4M Governance</text>

  <rect x="570" y="848" width="14" height="14" rx="3" fill="#e74c3c" opacity="0.85"/>
  <text x="590" y="859" font-size="9" fill="#555">Gate Scripts</text>

  <rect x="690" y="848" width="14" height="14" rx="3" fill="#7f8c8d" opacity="0.7"/>
  <text x="710" y="859" font-size="9" fill="#555">Execution Layer</text>

  <line x1="70" y1="878" x2="100" y2="878" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="110" y="882" font-size="9" fill="#555">Harness-Controlled Agent Boundary</text>

  <line x1="320" y1="878" x2="350" y2="878" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="882" font-size="9" fill="#555">Data Flow</text>

  <line x1="470" y1="878" x2="500" y2="878" stroke="#8e44ad" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="510" y="882" font-size="9" fill="#555">Governance Constraint Flows</text>

  <rect x="690" y="870" width="14" height="14" rx="3" fill="#2c3e50" opacity="0.15" stroke="#2c3e50" stroke-width="1"/>
  <text x="710" y="881" font-size="9" fill="#555">Audit &amp; Provenance</text>

  <!-- Core Flow Reference -->
  <text x="70" y="910" font-size="9" font-weight="bold" fill="#2c3e50">Core Flow:</text>
  <text x="70" y="925" font-size="8" fill="#555">LLM Backend &#x2192; Orchestrator &#x2192; Output Validation &#x2192; Tool Interception &#x2192; Permission Gate &#x2192; 4M Governance &#x2192; Gate Script &#x2192; Execution &#x2192; Audit Store</text>
</svg>
